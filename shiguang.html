<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拾光小铺 · 店内商品</title>
  <meta name="description" content="浏览拾光小铺的手机壳、配件、玩具、礼品和生活小物。商品仅在实体店销售。">
  <link rel="stylesheet" href="shiguang.css?v=3">
  <script src="store-config.js" defer></script><script src="shiguang.js?v=4" defer></script>
</head>
<body>
  <header><a class="brand" href="shiguang.html">拾光小铺<span>SHIGUANG SHOP</span></a><span class="store-label">线下好物 · 到店选购</span><button id="language" type="button" aria-label="Switch language">EN</button></header>
  <main>
    <section class="intro"><div class="intro-copy"><p class="eyebrow" data-zh="店内商品一览 · SIGNAL ONLINE" data-en="IN-STORE COLLECTION · SIGNAL ONLINE">店内商品一览 · SIGNAL ONLINE</p><h1 data-zh="把喜欢的小物，带进日常。" data-en="Little finds for everyday life.">把喜欢的小物，带进日常。</h1><p data-zh="这里的商品仅在实体店销售，欢迎到店选购。" data-en="Discover our in-store range. Purchases are available in store only.">这里的商品仅在实体店销售，欢迎到店选购。</p><div class="intro-tags"><span>✦ PICK YOUR JOY</span><span>♡ EVERYDAY FINDS</span><span>⌁ IN-STORE ONLY</span></div></div><div class="orbit-art" aria-hidden="true"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="star star-one">✦</span><span class="star star-two">✧</span><span class="ufo">◉</span><span class="robot">🤖</span><span class="cat">🐱</span><span class="heart">♥</span><span class="chip">▦</span></div><span class="intro-note" data-zh="拾光 · 拾起生活的小美好" data-en="Small things. Happy moments.">拾光 · 拾起生活的小美好</span></section>
    <section class="catalog" aria-label="商品 Products">
      <div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索商品或货号" aria-label="搜索商品或货号"></label><select id="sort" aria-label="排序"><option value="latest">最近更新</option><option value="low">价格从低到高</option><option value="high">价格从高到低</option><option value="name">商品名称</option></select></div>
      <nav id="categories" aria-label="商品分类"></nav>
      <div class="results"><span id="count" aria-live="polite"></span><label><input id="available" type="checkbox"><span data-zh="仅看有货" data-en="In stock only">仅看有货</span></label></div>
      <p id="status" role="status">正在加载店内商品…</p><button id="retry" hidden type="button">重新加载 / Retry</button>
      <div id="products" class="products"></div><button id="more" class="more" hidden type="button">查看更多</button>
    </section>
  </main>
  <footer><strong>拾光小铺</strong><span data-zh="仅展示店内商品，不提供网上下单。价格及库存以店内实际为准。" data-en="In-store collection only. Final prices and availability are confirmed in store.">仅展示店内商品，不提供网上下单。价格及库存以店内实际为准。</span></footer>
