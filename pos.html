<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GO GO SHOP 扫码收银</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#171918;background:#f3f5f4;--green:#176b4d;--red:#b33a32;--line:#d9dedb;--muted:#68716c;--panel:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.topbar{height:64px;background:#171918;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}.top-actions{display:flex;gap:8px}.icon-btn,.secondary,.primary{border:1px solid var(--line);background:#fff;border-radius:6px;min-height:42px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.topbar .icon-btn{color:#fff;border-color:#454947;background:transparent}.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:800}.primary:disabled{opacity:.45;cursor:not-allowed}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-panel{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px}.login-panel h1{margin:0 0 8px}.field{display:grid;gap:7px;margin-top:18px;font-weight:700}.field input,.scan-input{width:100%;height:52px;border:2px solid #aeb7b2;border-radius:6px;padding:0 15px;background:#fff}.field input:focus,.scan-input:focus{outline:3px solid #bfe4d5;border-color:var(--green)}.login-panel .primary{width:100%;margin-top:14px}.message{min-height:22px;color:var(--red);margin:12px 0 0}.app{min-height:100vh}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:calc(100vh - 64px)}.catalog{padding:24px;overflow:auto}.scan-wrap{background:#fff;border:1px solid var(--line);padding:18px;border-radius:8px}.scan-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.scan-label strong{font-size:18px}.hint{font-size:13px;color:var(--muted)}.scan-row{display:grid;grid-template-columns:1fr auto;gap:10px}.status{min-height:24px;margin:9px 0 0;font-size:14px;color:var(--muted)}.status.error{color:var(--red)}.status.success{color:var(--green)}.cart-head{display:flex;align-items:end;justify-content:space-between;margin:24px 0 10px}.cart-head h2{margin:0;font-size:20px}.cart-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.cart-table th,.cart-table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.cart-table th{font-size:12px;color:var(--muted);text-transform:uppercase;background:#fafbfa}.product-cell{display:flex;align-items:center;gap:12px;min-width:230px}.thumb{width:54px;height:54px;object-fit:cover;background:#eef1ef;border-radius:4px}.product-meta strong,.product-meta span{display:block}.product-meta span{font-size:12px;color:var(--muted);margin-top:4px}.qty{display:grid;grid-template-columns:36px 54px 36px;height:38px}.qty button,.qty input{border:1px solid var(--line);background:#fff;text-align:center}.qty button:first-child{border-radius:5px 0 0 5px}.qty button:last-child{border-radius:0 5px 5px 0}.qty input{border-left:0;border-right:0;width:54px}.remove{border:0;background:transparent;color:var(--red);padding:8px}.empty{background:#fff;border:1px dashed #bfc7c2;padding:54px 20px;text-align:center;color:var(--muted)}.summary{background:#fff;border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 64px)}.summary h2{margin:0 0 20px}.totals{display:grid;gap:14px}.total-row{display:flex;justify-content:space-between;color:var(--muted)}.grand{border-top:1px solid var(--line);padding-top:18px;color:#171918;font-size:26px;font-weight:900}.complete{width:100%;min-height:58px;font-size:18px;margin-top:auto}.summary-note{font-size:13px;color:var(--muted);line-height:1.5;margin:14px 0}.last-order{border:1px solid #a8d2c0;background:#edf8f3;border-radius:6px;padding:14px;margin-top:18px;color:#12563e}.last-order strong,.last-order span{display:block}.last-order span{font-size:13px;margin-top:5px}.loading{position:fixed;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;z-index:5;font-weight:800}.loading i{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.workspace{grid-template-columns:1fr}.summary{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}.complete{margin-top:22px}.cart-table thead{display:none}.cart-table,.cart-table tbody,.cart-table tr,.cart-table td{display:block}.cart-table tr{padding:12px;border-bottom:1px solid var(--line)}.cart-table td{border:0;padding:6px}.topbar{padding:0 14px}.catalog{padding:14px}.brand span{display:none}}
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-panel" id="loginForm">
      <h1>扫码收银</h1><p class="hint">使用 GO GO SHOP 管理员密码登录</p>
      <label class="field"><span>管理员邮箱</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>管理员密码</span><input id="password" type="password" autocomplete="current-password" required autofocus></label>
      <button class="primary" type="submit"><i data-lucide="log-in"></i>登录收银台</button>
      <button class="secondary" id="resetPasswordBtn" type="button" style="width:100%;margin-top:10px"><i data-lucide="key-round"></i>忘记密码，发送重置邮件</button>
      <p class="message" id="loginMessage"></p>
    </form>
  </section>
  <section class="login hidden" id="recoveryView">
    <form class="login-panel" id="recoveryForm">
      <h1>设置新密码</h1><p class="hint">请输入至少 8 位的新管理员密码</p>
      <label class="field"><span>新密码</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>再次输入新密码</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary" type="submit"><i data-lucide="save"></i>保存新密码并进入收银台</button>
      <p class="message" id="recoveryMessage"></p>
    </form>
  </section>
  <section class="app hidden" id="appView">
    <header class="topbar"><div class="brand"><i data-lucide="scan-barcode"></i><span>GO GO SHOP</span><b>扫码收银</b></div><div class="top-actions"><a class="icon-btn" href="./gogoshop.html#admin"><i data-lucide="layout-dashboard"></i>后台</a><button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i>退出</button></div></header>
    <main class="workspace">
      <section class="catalog">
        <div class="scan-wrap">
          <div class="scan-label"><strong>扫描或输入货号</strong><span class="hint">扫码枪输入后按 Enter</span></div>
          <form class="scan-row" id="scanForm"><input class="scan-input" id="scanInput" type="search" placeholder="条码、SKU 或商品货号" autocomplete="off"><button class="primary" type="submit"><i data-lucide="plus"></i>加入</button></form>
          <p class="status" id="scanStatus" aria-live="polite">商品资料与网络后台实时同步</p>
        </div>
        <div class="cart-head"><h2>本次订单</h2><button class="secondary" id="clearBtn" type="button"><i data-lucide="trash-2"></i>清空</button></div>
        <div id="cartContent"></div>
      </section>
      <aside class="summary">
        <h2>订单合计</h2><div class="totals"><div class="total-row"><span>商品种类</span><strong id="lineCount">0</strong></div><div class="total-row"><span>商品数量</span><strong id="itemCount">0 件</strong></div><div class="total-row grand"><span>应收</span><strong id="total">NZ$0.00</strong></div></div>
        <div class="last-order hidden" id="lastOrder"></div><p class="summary-note">只有点击“完成订单”且数据库保存成功后才会扣减库存。订单会立即出现在网页后台。</p>
        <button class="primary complete" id="completeBtn" type="button" disabled><i data-lucide="circle-check-big"></i>完成订单</button>
      </aside>
    </main>
  </section>
  <div class="loading hidden" id="loading"><div><i data-lucide="loader-circle"></i> 正在完成订单...</div></div>
  <script>
    const SUPABASE_URL="https://ucnkcddhrptqpdlvcohy.supabase.co";
    const SUPABASE_KEY="sb_publishable_zv6WbyD1hZKUx-Zyak-fPw_e1mURTN8";
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const state={products:[],cart:new Map(),profile:null,busy:false};
    const $=(s)=>document.querySelector(s); const money=new Intl.NumberFormat("en-NZ",{style:"currency",currency:"NZD"});
    const escapeHtml=(v)=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    function icons(){window.lucide?.createIcons()}
    function setStatus(text,type=""){$("#scanStatus").textContent=text;$("#scanStatus").className=`status ${type}`}
    async function loadProducts(){const {data,error}=await db.from("products").select("id,title,price,stock,image,sku,barcode,deleted_at").is("deleted_at",null).order("title");if(error)throw error;state.products=data||[]}
    async function checkAdmin(user){const {data,error}=await db.from("profiles").select("id,is_admin").eq("id",user.id).single();if(error||!data?.is_admin)throw new Error("此账号没有管理员权限");state.profile=data}
    async function enterApp(user){await checkAdmin(user);await loadProducts();$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");render();setTimeout(()=>$("#scanInput").focus(),50)}
    function showRecovery(){$("#loginView").classList.add("hidden");$("#appView").classList.add("hidden");$("#recoveryView").classList.remove("hidden");setTimeout(()=>$("#newPassword").focus(),50)}
    async function loadAdminEmail(){const {data}=await db.rpc("get_admin_login_email");if(data&&!$("#email").value)$("#email").value=data}
    function loginError(error){const message=String(error?.message||error||"");if(/invalid login credentials/i.test(message))return "邮箱或密码不正确。忘记密码可点击下方按钮重置。";if(/email not confirmed/i.test(message))return "请先在邮箱中完成账号验证。";if(/failed to fetch|network/i.test(message))return "无法连接网络后台，请检查网络后重试。";return message||"登录失败，请重试。"}
    $("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginMessage").textContent="正在登录...";try{const email=$("#email").value.trim();const {data,error}=await db.auth.signInWithPassword({email,password:$("#password").value});if(error)throw error;await enterApp(data.user)}catch(error){$("#loginMessage").textContent=loginError(error)}});
    $("#resetPasswordBtn").addEventListener("click",async()=>{const email=$("#email").value.trim();if(!email){$("#loginMessage").textContent="请先填写管理员邮箱。";$("#email").focus();return}const button=$("#resetPasswordBtn");button.disabled=true;$("#loginMessage").textContent="正在发送重置邮件...";const redirectTo=`${location.origin}${location.pathname}?reset=password`;const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});button.disabled=false;$("#loginMessage").textContent=error?loginError(error):"重置邮件已发送。请使用最新邮件中的链接，旧邮件链接已失效。"});
    $("#recoveryForm").addEventListener("submit",async e=>{e.preventDefault();const password=$("#newPassword").value;const confirmation=$("#confirmPassword").value;if(password.length<8){$("#recoveryMessage").textContent="新密码至少需要 8 位。";return}if(password!==confirmation){$("#recoveryMessage").textContent="两次输入的密码不一致。";return}$("#recoveryMessage").textContent="正在保存新密码...";const {data,error}=await db.auth.updateUser({password});if(error){$("#recoveryMessage").textContent=loginError(error);return}history.replaceState({},"",location.pathname);$("#recoveryView").classList.add("hidden");try{await enterApp(data.user)}catch(error){$("#recoveryMessage").textContent=loginError(error);$("#recoveryView").classList.remove("hidden")}});
    function findProduct(code){const key=code.trim().toLowerCase();return state.products.find(p=>[p.barcode,p.sku,p.id].some(v=>String(v||"").trim().toLowerCase()===key))}
    function addCode(code){const product=findProduct(code);if(!product){setStatus(`找不到货号：${code}`,"error");return}const current=state.cart.get(product.id)||0;if(current>=Number(product.stock)){setStatus(`${product.title} 库存不足，当前仅剩 ${product.stock} 件`,"error");return}state.cart.set(product.id,current+1);setStatus(`${product.title} 已加入，数量 ${current+1}`,"success");render();$("#scanInput").value=""}
    $("#scanForm").addEventListener("submit",e=>{e.preventDefault();const value=$("#scanInput").value.trim();if(value)addCode(value);$("#scanInput").focus()});
    function updateQty(id,value){const product=state.products.find(p=>p.id===id);const quantity=Math.max(0,Math.min(Number(product?.stock||0),Math.floor(Number(value)||0)));if(quantity)state.cart.set(id,quantity);else state.cart.delete(id);render();$("#scanInput").focus()}
    function render(){const lines=[...state.cart].map(([id,quantity])=>({product:state.products.find(p=>p.id===id),quantity})).filter(x=>x.product);const count=lines.reduce((s,x)=>s+x.quantity,0);const total=lines.reduce((s,x)=>s+Number(x.product.price)*x.quantity,0);$("#lineCount").textContent=lines.length;$("#itemCount").textContent=`${count} 件`;$("#total").textContent=money.format(total);$("#completeBtn").disabled=!lines.length||state.busy;$("#clearBtn").disabled=!lines.length;$("#cartContent").innerHTML=lines.length?`<table class="cart-table"><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th></th></tr></thead><tbody>${lines.map(({product:p,quantity:q})=>`<tr><td><div class="product-cell"><img class="thumb" src="${escapeHtml(p.image||"")}" alt=""><div class="product-meta"><strong>${escapeHtml(p.title)}</strong><span>${escapeHtml(p.sku||p.barcode||p.id)} · 库存 ${p.stock}</span></div></div></td><td>${money.format(p.price)}</td><td><div class="qty"><button data-id="${escapeHtml(p.id)}" data-delta="-1">−</button><input data-id="${escapeHtml(p.id)}" value="${q}" inputmode="numeric"><button data-id="${escapeHtml(p.id)}" data-delta="1">+</button></div></td><td><strong>${money.format(Number(p.price)*q)}</strong></td><td><button class="remove" data-remove="${escapeHtml(p.id)}" title="移除"><i data-lucide="x"></i></button></td></tr>`).join("")}</tbody></table>`:`<div class="empty"><i data-lucide="scan-line"></i><p>扫描商品条码，商品会自动加入订单</p></div>`;icons()}
    $("#cartContent").addEventListener("click",e=>{const button=e.target.closest("button");if(!button)return;if(button.dataset.remove)updateQty(button.dataset.remove,0);if(button.dataset.delta){const id=button.dataset.id;updateQty(id,(state.cart.get(id)||0)+Number(button.dataset.delta))}});$("#cartContent").addEventListener("change",e=>{if(e.target.matches("input[data-id]"))updateQty(e.target.dataset.id,e.target.value)});
    $("#clearBtn").addEventListener("click",()=>{if(state.cart.size&&confirm("确定清空当前订单吗？")){state.cart.clear();render();setStatus("订单已清空")}});
    $("#completeBtn").addEventListener("click",async()=>{if(!state.cart.size||state.busy)return;state.busy=true;$("#loading").classList.remove("hidden");render();try{const items=[...state.cart].map(([product_id,quantity])=>({product_id,quantity}));const {data,error}=await db.rpc("create_pos_order",{p_items:items}).single();if(error)throw error;state.cart.clear();await loadProducts();$("#lastOrder").classList.remove("hidden");$("#lastOrder").innerHTML=`<strong>订单完成 ${escapeHtml(data.order_number)}</strong><span>${data.item_count} 件 · ${money.format(data.total)} · 库存已更新</span>`;setStatus("订单已保存到网页后台","success")}catch(error){setStatus(error.message||"订单提交失败，库存没有扣减","error");alert(`订单未完成：${error.message||"请重试"}`)}finally{state.busy=false;$("#loading").classList.add("hidden");render();$("#scanInput").focus()}});
    $("#logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();location.reload()});
    db.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")showRecovery()});
    db.auth.getSession().then(async({data})=>{const recoveryMode=new URLSearchParams(location.search).get("reset")==="password"||location.hash.includes("type=recovery");if(recoveryMode&&data.session?.user){showRecovery();return}if(data.session?.user){try{await enterApp(data.session.user);return}catch{await db.auth.signOut()}}await loadAdminEmail()});icons();
  </script>
</body>
</html>
